<?xml version="1.0" encoding="UTF-8"?>
<!-- Gatefold: an opened gatefold sleeve, the record spinning out of its pocket. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dc8add"/><stop offset="1" stop-color="#9141ac"/></linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa348"/><stop offset="1" stop-color="#e66100"/></linearGradient>
    <linearGradient id="vinyl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d3846"/><stop offset="1" stop-color="#241f31"/></linearGradient>
    <clipPath id="art"><rect x="4" y="4" width="58" height="58" rx="6"/></clipPath>
  </defs>
  <!-- the record, coming out of the pocket -->
  <g transform="translate(84 42)">
    <circle cx="2" cy="4" r="33" fill="#1c71d8" opacity="0.35"/>
    <circle r="33" fill="url(#vinyl)"/>
    <circle r="27" fill="none" stroke="#5e5c64" stroke-width="1.3" opacity="0.7"/>
    <circle r="21.5" fill="none" stroke="#5e5c64" stroke-width="1.3" opacity="0.7"/>
    <path d="M-23 -14 A27 27 0 0 1 -7 -26" fill="none" stroke="#99c1f1" stroke-width="3.2" stroke-linecap="round" opacity="0.85"/>
    <path d="M19 19 A27 27 0 0 1 9 25.5" fill="none" stroke="#99c1f1" stroke-width="3.2" stroke-linecap="round" opacity="0.5"/>
    <circle r="12" fill="url(#label)"/>
    <circle r="2.8" fill="#f6f5f4"/>
  </g>
  <!-- spin lines -->
  <path d="M100 2.5 A42 42 0 0 1 124 26 M122.5 38 A42 42 0 0 1 121 47" fill="none" stroke="#99c1f1" stroke-width="5" stroke-linecap="round"/>
  <!-- the opened sleeve -->
  <g transform="translate(46 52) rotate(4)">
    <!-- inner flap with the liner notes, swung open towards us -->
    <path d="M2 5 L-36 -3.5 Q-40 -4.4 -40 -0.4 L-40 72.4 Q-40 76.4 -36 75.5 L2 70 Z" fill="#1c71d8" opacity="0.35"/>
    <path d="M0 0 L-36 -8.5 Q-40 -9.4 -40 -5.4 L-40 71.4 Q-40 75.4 -36 74.5 L0 66 Z" fill="#ffffff"/>
    <path d="M-6 9 L-31 3.4 M-6 18 L-31 12.8 M-6 27 L-22 23.8" stroke="#c0bfbc" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-6 39 L-31 35.2 M-6 48 L-26 45.4" stroke="#deddda" stroke-width="4.5" stroke-linecap="round"/>
    <!-- the cover, with the pocket -->
    <rect x="2" y="4" width="66" height="66" rx="10" fill="#1c71d8" opacity="0.35"/>
    <rect x="0" y="0" width="66" height="66" rx="10" fill="#ffffff"/>
    <g clip-path="url(#art)">
      <rect x="4" y="4" width="58" height="58" fill="url(#cover)"/>
      <circle cx="33" cy="38" r="14" fill="#f9f06b"/>
      <path d="M4 44 H62 V62 H4 Z" fill="#613583" opacity="0.55"/>
      <path d="M4 52 H62" stroke="#dc8add" stroke-width="2.5"/>
    </g>
    <path d="M0.75 1 V65" stroke="#deddda" stroke-width="1.5"/>
  </g>
  <path d="M22 10 Q23.4 17.6 31 19 Q23.4 20.4 22 28 Q20.6 20.4 13 19 Q20.6 17.6 22 10 Z" fill="#f6d32d"/>
  <path d="M114 94 Q115.2 100.8 122 102 Q115.2 103.2 114 110 Q112.8 103.2 106 102 Q112.8 100.8 114 94 Z" fill="#f6d32d"/>
</svg>
