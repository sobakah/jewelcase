<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128">
  <!-- Jewelcase: a clear CD jewel case from the front (the hinge on the
       left), the disc inside on its dark tray. Printed on the disc: a blue
       water slide with a pink channel, a nod to the glossy water slides on
       SOPHIE's PRODUCT singles. Flat colours, a darker edge below and flat
       glare on the lid, like GNOME's own icons; the case fills the canvas
       (94 x 86 plus its edge). -->
  <clipPath id="disc"><circle cx="63" cy="71" r="36"/></clipPath>
  <path id="slide" d="M16.7 98.3L17.8 96.5L18.5 94.4L19.0 92.0L19.3 89.6L19.8 87.2L20.5 85.1L21.6 83.3L23.1 82.0L25.0 81.1L27.3 80.6L29.8 80.2L32.2 79.8L34.5 79.3L36.4 78.4L38.0 77.1L39.0 75.3L39.7 73.2L40.2 70.8L40.6 68.3L41.0 66.0L41.7 63.8L42.8 62.1L44.3 60.8L46.3 59.9L48.5 59.4L51.0 59.0L53.4 58.6L55.7 58.0L57.6 57.2L59.2 55.9L60.3 54.1L61.0 52.0L61.4 49.6L61.8 47.1L62.2 44.8L62.9 42.6L64.0 40.9L65.5 39.6L67.5 38.7L69.7 38.1L72.2 37.8L74.6 37.4L76.9 36.8L78.9 35.9L80.4 34.6L81.5 32.9L82.2 30.8L82.6 28.4L83.0 25.9L83.4 23.5L84.1 21.4L85.2 19.7" fill="none" stroke-linejoin="round"/>

  <!-- the case: its edge, the frame, the tray, the hinge -->
  <rect x="10" y="34" width="94" height="86" rx="8" fill="#77767b"/>
  <rect x="10" y="28" width="94" height="86" rx="8" fill="#deddda"/>
  <rect x="24" y="32" width="76" height="78" rx="4" fill="#3d3846"/>
  <path d="M18 28h4v86h-4a8 8 0 0 1-8-8V36a8 8 0 0 1 8-8z" fill="#c0bfbc"/>
  <path d="M16 40v8M16 94v8" stroke="#deddda" stroke-width="3" stroke-linecap="round"/>

  <!-- the disc and its print: the slide's shadow, its rims, body and channel -->
  <g clip-path="url(#disc)">
    <rect width="128" height="128" fill="#fcfcfc"/>
    <use xlink:href="#slide" stroke="#c0bfbc" stroke-width="15" transform="translate(6 6)"/>
    <use xlink:href="#slide" stroke="#1890fc" stroke-width="15"/>
    <use xlink:href="#slide" stroke="#0060d8" stroke-width="11"/>
    <use xlink:href="#slide" stroke="#fc84fc" stroke-width="6.3"/>
    <use xlink:href="#slide" stroke="#fcb4fc" stroke-width="2.1" transform="translate(-0.8 -0.8)"/>
  </g>
  <circle cx="63" cy="71" r="35.25" fill="none" stroke="#c0bfbc" stroke-width="1.5"/>
  <circle cx="63" cy="71" r="11" fill="#deddda"/>
  <circle cx="63" cy="71" r="5.5" fill="#3d3846"/>

  <!-- glare on the clear lid -->
  <path d="M24 32h32l-32 42z" fill="#ffffff" opacity="0.3"/>
  <path d="M64 32h10l-50 66v-13z" fill="#ffffff" opacity="0.22"/>
</svg>
