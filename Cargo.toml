[workspace]
resolver = "3"
members = ["app", "core", "lyrics", "metadata", "soloist", "spotify", "stream", "tools"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/sobakah/gatefold"

[workspace.dependencies]
gatefold-core = { path = "core" }
gatefold-lyrics = { path = "lyrics" }
gatefold-metadata = { path = "metadata" }
gatefold-soloist = { path = "soloist" }
gatefold-spotify = { path = "spotify" }
gatefold-stream = { path = "stream" }
gatefold-tools = { path = "tools" }

adw = { package = "libadwaita", version = "0.9", features = ["v1_10"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_24"] }
async-channel = "2"
base64 = "0.23"
# Audio analysis for "sounds similar" (CONCEPT.md §7). Only the analysis:
# Gatefold decodes with GStreamer, like playback; GPL-3.0-only.
bliss-audio = { version = "0.13", default-features = false, features = ["analysis"] }
glycin = { version = "4", default-features = false, features = ["async-io"] }
gst = { package = "gstreamer", version = "0.25", features = ["v1_28"] }
gst-app = { package = "gstreamer-app", version = "0.25", features = ["v1_28"] }
gst-audio = { package = "gstreamer-audio", version = "0.25", features = ["v1_28"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
futures-lite = "2"
libc = "0.2"
lofty = "0.25"
mpris-server = "0.10"
quick-xml = "0.38"
notify = "8"
# Spotify tokens in the keyring (CONCEPT.md §9.3); async-io, not tokio.
oo7 = { version = "0.7", default-features = false, features = ["async-std", "native_crypto"] }
rand = "0.9"
rusqlite = "0.37"
rusqlite_migration = "2"
sha2 = "0.11"
serde_json = "1"
unicode-script = "0.5"
ureq = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tempfile = "3"

[profile.release]
lto = "thin"

# Cover resizing is painfully slow unoptimized; keep debug builds usable.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

# Song analysis is far too slow unoptimized.
[profile.dev.package.bliss-audio]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3






