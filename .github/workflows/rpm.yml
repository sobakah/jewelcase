# Builds the Fedora RPM in a clean Fedora 45 container (CONCEPT.md §12),
# and the release Flatpak as a bundle for image-based systems (README.md).
#
# - Pushing a version tag like 0.5.0 (no "v") builds it and puts the
#   packages and the bundle on a draft release (a pre-release for 0.x versions and tags
#   with "-"); check it, then publish it on GitHub. Its notes are the
#   version's section of CHANGELOG.md (`## [0.5.0] — date`).
# - "Run workflow" in the Actions tab builds it as a test; tick "release"
#   to also make a draft release for the version in meson.build.
name: RPM and Flatpak

on:
  push:
    tags: ["[0-9]*"]
  workflow_dispatch:
    inputs:
      release:
        description: Also make a draft release with the packages
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  rpm:
    name: Build the RPM (Fedora 45)
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    timeout-minutes: 120
    steps:
      - name: Install the tools
        run: >
          dnf -y install git make tar xz rpm-build dnf5-plugins
          rust-srpm-macros cargo-rpm-macros

      - uses: actions/checkout@v7

      - name: Install the build dependencies
        run: dnf -y builddep jewelcase.spec

      - name: Version
        id: version
        run: |
          version=$(sed -n "s/^  version: '\(.*\)',$/\1/p" meson.build)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} doesn't match the version $version in meson.build"
            exit 1
          fi

      # Source and vendored Rust dependencies (CONCEPT.md §12).
      - name: Source tarballs
        run: make tarballs

      - name: Build
        run: rpmbuild -ba --define "_topdir $PWD/rpmbuild" jewelcase.spec

      - uses: actions/upload-artifact@v7
        with:
          name: jewelcase-${{ steps.version.outputs.version }}-rpms
          path: |
            rpmbuild/RPMS/*/*.rpm
            rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error

    outputs:
      version: ${{ steps.version.outputs.version }}

  flatpak:
    name: Build the Flatpak bundle
    runs-on: ubuntu-latest
    # flatpak-builder's sandbox (bubblewrap) needs a privileged container.
    container:
      image: registry.fedoraproject.org/fedora:45
      options: --privileged
    timeout-minutes: 120
    steps:
      - name: Install the tools
        run: dnf -y install git make flatpak flatpak-builder

      - uses: actions/checkout@v7

      # The GNOME SDK and the Rust extension come from Flathub.
      - name: Build
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          make flatpak-release

      - uses: actions/upload-artifact@v7
        with:
          name: jewelcase-flatpak
          path: _build/flatpak-release/*.flatpak
          if-no-files-found: error

  release:
    name: Draft release
    needs: [rpm, flatpak]
    if: github.ref_type == 'tag' || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          name: jewelcase-${{ needs.rpm.outputs.version }}-rpms
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: jewelcase-flatpak
          path: dist

      - name: Draft release with the packages
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.rpm.outputs.version }}
        run: |
          tag="$VERSION"
          # 0.x versions and tags like 1.0.0-beta1 are pre-releases.
          prerelease=""
          case "$VERSION" in 0.*|*-*) prerelease="--prerelease" ;; esac
          # The program, the source package and the Flatpak bundle;
          # debuginfo stays in the workflow's artifact.
          files=$(find dist \( -name '*.rpm' ! -name '*-debuginfo-*' ! -name '*-debugsource-*' \) -o -name '*.flatpak')
          # The version's section of CHANGELOG.md (from its heading
          # "## [X.Y.Z] — date" to the next "## " or the link list at the
          # end), or GitHub's own notes.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]*\]: /) { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$tag" $files \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Jewelcase $VERSION" \
            --draft $prerelease \
            "${notes[@]}"
