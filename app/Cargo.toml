[package]
name = "jewelcase"
description = "A local-first music player for albums, artists and playlists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# librespot streaming (CONCEPT.md §9.4). Off by default: without it the
# build contains no librespot code.
spotify-stream = ["dep:jewelcase-stream"]

[dependencies]
jewelcase-core.workspace = true
jewelcase-lyrics.workspace = true
jewelcase-metadata.workspace = true
jewelcase-soloist.workspace = true
jewelcase-spotify.workspace = true
jewelcase-stream = { workspace = true, optional = true }
jewelcase-tools.workspace = true

adw.workspace = true
async-channel.workspace = true
futures-lite.workspace = true
libc.workspace = true
mpris-server.workspace = true
oo7.workspace = true
rand.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq.workspace = true
gettext-rs.workspace = true
gtk.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
