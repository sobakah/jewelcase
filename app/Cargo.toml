[package]
name = "gatefold"
description = "A local-first music player for albums, artists and playlists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# librespot streaming (CONCEPT.md §9.4). Off by default: without it the
# build contains no librespot code.
spotify-stream = ["dep:gatefold-stream"]

[dependencies]
gatefold-core.workspace = true
gatefold-lyrics.workspace = true
gatefold-metadata.workspace = true
gatefold-spotify.workspace = true
gatefold-stream = { workspace = true, optional = true }
gatefold-tools.workspace = true

adw.workspace = true
async-channel.workspace = true
futures-lite.workspace = true
libc.workspace = true
mpris-server.workspace = true
oo7.workspace = true
rand.workspace = true
serde_json.workspace = true
gettext-rs.workspace = true
gtk.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
